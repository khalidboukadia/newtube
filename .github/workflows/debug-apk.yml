name: Build NewTube debug APK

# Phone (stmobile) debug build, for trying a branch on a device.
# Run it from the Actions tab, or it runs on every push to a feature/** branch.
on:
  push:
    branches: [ "feature/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileDebug

      - name: Upload APKs (armeabi-v7a, arm64-v8a, universal)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube-debug-${{ github.run_number }}
          path: smarttubetv/build/outputs/apk/stmobile/debug/*.apk
          if-no-files-found: error
